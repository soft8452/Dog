<!DOCTYPE html>
<html lang="th">

<head>

    <!-- กำหนดการเข้ารหัสภาษาไทย -->
    <meta charset="UTF-8">

    <!-- รองรับมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ชื่อหน้าเว็บ -->
    <title>ข้อมูลนักศึกษา</title>

    <!-- เชื่อมต่อ CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- กล่องหลัก -->
    <div class="container">

        <!-- หัวข้อ -->
        <h1>ข้อมูลนักศึกษา</h1>


        <!-- =========================
             แบบฟอร์มกรอกข้อมูล
        ========================== -->

        <form class="Form-container" id="Studentform">

            <!-- รหัสนักศึกษา -->
            <label for="id_std">รหัสนักศึกษา</label>

            <input
                type="text"
                id="id_std"
                name="id_std"
                placeholder="กรอกรหัสนักศึกษา"
            >


            <!-- ชื่อ-นามสกุล -->
            <label for="fullname">ชื่อ-นามสกุล</label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="กรอกชื่อ-นามสกุล"
            >


            <!-- คณะ -->
            <label for="department">คณะ</label>

            <select
                id="department"
                name="department"
            >

                <option value="เทคโนโลยีสารสนเทศ">
                    เทคโนโลยีสารสนเทศ
                </option>

                <option value="บริหาร">
                    บริหาร
                </option>

                <option value="บัญชี">
                    บัญชี
                </option>

            </select>


            <!-- เบอร์โทร -->
            <label for="telephone">เบอร์โทร</label>

            <input
                type="text"
                id="telephone"
                name="telephone"
                placeholder="กรอกเบอร์โทรศัพท์"
            >


            <!-- Email -->
            <label for="Email">Email</label>

            <input
                type="email"
                id="Email"
                name="Email"
                placeholder="กรอกอีเมล"
            >


            <!-- ปุ่ม -->
            <div class="buttons">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit
                </button>

                <button
                    type="reset"
                    class="cancel-btn"
                >
                    Cancel
                </button>

            </div>

        </form>


        <!-- =========================
             ตารางข้อมูล
        ========================== -->

        <section class="table-section">

            <h2 class="table-title">
                ข้อมูลนักศึกษา
            </h2>


            <div class="table-wrapper">

                <table class="student-table">

                    <thead>

                        <tr>

                            <th>รหัสนักศึกษา</th>

                            <th>ชื่อ-นามสกุล</th>

                            <th>คณะ</th>

                            <th>เบอร์โทร</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td>69703347</td>

                            <td>ตัวอย่าง นักศึกษา</td>

                            <td>เทคโนโลยีสารสนเทศ</td>

                            <td>096-XXXXXXX</td>

                        </tr>


                        <tr>

                            <td>69703348</td>

                            <td>ตัวอย่าง นักศึกษา</td>

                            <td>เทคโนโลยีสารสนเทศ</td>

                            <td>086-XXXXXXX</td>

                        </tr>


                        <tr>

                            <td>69703349</td>

                            <td>ตัวอย่าง นักศึกษา</td>

                            <td>เทคโนโลยีสารสนเทศ</td>

                            <td>066-XXXXXXX</td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</body>

</html>
